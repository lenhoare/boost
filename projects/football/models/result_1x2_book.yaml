# Same as result_1x2 but the book prices are features. Tests whether history adds anything on top of the market.
task:
  type: multiclass
  target: ftr
  classes: [H, D, A]

baseline: [book_h, book_d, book_a]        # de-vigged closing prices; the bar to beat
passthrough: [odds_home, odds_draw, odds_away, odds_source, home_goals, away_goals]

features:
  include: ["*"]
  exclude: ["home_team", "away_team", "referee"]

split:
  strategy: holdout
  train_fraction: 0.75
  valid_fraction: 0.15

model:
  library: lightgbm
  rounds: 3000
  early_stopping: 150
  refit: true
  params:
    learning_rate: 0.01
    num_leaves: 7
    min_data_in_leaf: 60
    feature_fraction: 0.6
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
    min_gain_to_split: 0.0
    seed: 7
