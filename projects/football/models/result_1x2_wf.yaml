# result_1x2 evaluated walk-forward: retrain before each season, predict that season.
description: >-
  Same inputs as result_1x2 (team histories only, no bookmaker prices) but evaluated walk-forward: for every season from 2014-15 the model is retrained on all earlier seasons and then predicts that season. That gives honest out-of-sample forecasts for 13 seasons instead of 4.

task:
  type: multiclass
  target: ftr
  classes: [H, D, A]

baseline: [book_h, book_d, book_a]        # de-vigged closing prices; the bar to beat
passthrough: [odds_home, odds_draw, odds_away, odds_source, home_goals, away_goals]

features:
  include: ["*"]
  exclude: ["book_*", "home_team", "away_team", "referee"]

split:
  strategy: walk_forward
  min_periods: 4
  valid_periods: 1

model:
  library: lightgbm
  rounds: 3000
  early_stopping: 150
  refit: true
  params:
    learning_rate: 0.01
    num_leaves: 7
    min_data_in_leaf: 60
    feature_fraction: 0.6
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
    min_gain_to_split: 0.0
    seed: 7
